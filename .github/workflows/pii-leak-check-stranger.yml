name: PII leak check (stranger audit)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pii-leak:
    runs-on: ubuntu-latest
    env:
      CONFORMANCE_TARGET_API_KEY: sk-demo
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install llm-shield-proxy

      - uses: ninadphalak/LLM-Shield-Proxy@benchmark-v0.5.0
        with:
          target-base-url: http://127.0.0.1:4000/v1
          start-command: ./scripts/start-test-gateway.sh
          upstream-env: UPSTREAM_BASE_URL
